name: CI — Tests & Vérification WebView2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests unitaires & WebView2 (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter la suite de tests unitaires (9/9)
        run: npm test

      - name: Vérifier l'intégration WebView2 / PDF.js / Stylet
        run: npm run verify:webview2
