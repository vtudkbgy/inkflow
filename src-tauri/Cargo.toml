[package]
name = "plume-studio-pro"
version = "1.0.0"
description = "InkFlow — Application native légère (Tauri v2 / WebView2) de prise de notes manuscrites au stylet Windows Ink et d'annotation PDF 100 % hors-ligne"
authors = ["InkFlow"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "plume_studio_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn", "system-proxy"] }
sha2 = "0.10"
base64 = "0.23"
getrandom = "0.3"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
